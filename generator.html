<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Shoulder — Puzzle Generator</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --font-sans: system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f7f7f5;
      font-family: var(--font-sans);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #666; margin-bottom: 32px; }
    .card {
      background: #fff;
      border: 1px solid #e0e0de;
      border-radius: 14px;
      padding: 28px 32px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 8px; }
    .diff-row {
      display: flex; gap: 8px; margin-bottom: 20px;
    }
    .diff-btn {
      flex: 1; padding: 8px 0; border: 1.5px solid #d0d0ce; border-radius: 8px;
      background: #f7f7f5; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      color: #555;
    }
    .diff-btn.active {
      background: #1a1a1a; color: #fff; border-color: #1a1a1a;
    }
    .count-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    }
    .count-row input[type=number] {
      width: 72px; padding: 7px 10px; border: 1.5px solid #d0d0ce;
      border-radius: 8px; font-size: 14px; font-family: inherit; text-align: center;
    }
    .count-row span { font-size: 13px; color: #555; }
    .gen-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #1a1a1a; color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
      letter-spacing: 0.02em;
    }
    .gen-btn:disabled { opacity: 0.45; cursor: default; }
    .progress {
      margin-top: 20px; font-size: 13px; color: #666; min-height: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .spinner {
      width: 14px; height: 14px; border: 2px solid #ccc;
      border-top-color: #1a1a1a; border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
      display: none;
    }
    .spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .output-section { margin-top: 28px; display: none; }
    .output-section.visible { display: block; }
    .output-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .output-header span { font-size: 13px; font-weight: 600; color: #555; }
    .copy-btn {
      padding: 5px 14px; border: 1.5px solid #d0d0ce; border-radius: 7px;
      background: #f7f7f5; font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: #ececea; }
    .copy-btn.copied { background: #d4edda; border-color: #a3cfbb; color: #1a5e35; }
    textarea {
      width: 100%; height: 220px; font-family: 'Menlo', 'Consolas', monospace;
      font-size: 11px; line-height: 1.5; padding: 12px;
      border: 1.5px solid #d0d0ce; border-radius: 8px; resize: vertical;
      background: #fafaf9; color: #1a1a1a;
    }
    .puzzle-list {
      margin-top: 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .puzzle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: #f7f7f5; border-radius: 8px;
      border: 1px solid #e8e8e6; font-size: 13px;
    }
    .puzzle-row .pid { font-weight: 700; font-family: monospace; color: #1a1a1a; }
    .puzzle-row .meta { color: #888; font-size: 12px; }
    .puzzle-row .badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px;
    }
    .badge-easy    { background: #d4edda; color: #1a5e35; }
    .badge-medium  { background: #fff3cd; color: #7d5a00; }
    .badge-hard    { background: #fde0d9; color: #7d2612; }
    .badge-extreme { background: #e8d5f7; color: #4a1272; }
  </style>
</head>
<body>
  <h1>Cold Shoulder — Puzzle Generator</h1>
  <p class="sub">Generate pre-built puzzles to load into the game</p>

  <div class="card">
    <label>Difficulty</label>
    <div class="diff-row">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
      <button class="diff-btn" data-diff="extreme">Extreme</button>
    </div>

    <div class="count-row">
      <label style="margin:0">Generate</label>
      <input type="number" id="count-input" value="10" min="1" max="100">
      <span>puzzles</span>
    </div>

    <div class="count-row">
      <label style="margin:0">Seed</label>
      <input type="text" id="seed-input" placeholder="optional — same seed reproduces same puzzles" style="flex:1">
    </div>

    <button class="gen-btn" id="gen-btn" onclick="startGeneration()">Generate Puzzles</button>

    <div class="progress">
      <div class="spinner" id="spinner"></div>
      <span id="progress-text"></span>
    </div>

    <div class="output-section" id="output-section">
      <div class="output-header">
        <span id="output-label">Generated puzzles</span>
        <button class="copy-btn" id="copy-btn" onclick="copyOutput()">Copy JSON</button>
      </div>
      <textarea id="output-ta" readonly spellcheck="false"></textarea>
      <div class="puzzle-list" id="puzzle-list"></div>
    </div>
  </div>

  <script>

  medium:  { n: 8,  minSize: 2, maxSize: 12, pins: 2, maxRounds: 120, maxCandidates: 40, weights: { blob: 0.40, elbow: 0.30, snake: 0.20, spiral: 0.10 } },
  hard:    { n: 10, minSize: 3, maxSize: 15, pins: 4, maxRounds: 160, maxCandidates: 30, weights: { blob: 0.20, elbow: 0.25, snake: 0.35, spiral: 0.20 } },
  // Extreme stays 10×10: 12×12 one-star puzzles can't be made reliably unique
  // without so many pinned regions that the logic turns shallow. Depth (t3 ≥ 4)

    }
    for (let i = 0; i < n && !progress; i++) {
      for (const kind of ['row', 'col']) {
        const u = unitAvail(kind, i);
        if (u.hasStar || !u.avail.length) continue;
        const regsIn = new Set(u.avail.map(([r, c]) => reg[r][c]));
        if (regsIn.size === 1) {
          const g = reg[u.avail[0][0]][u.avail[0][1]];
          for (const [r, c] of cells[g]) {
            const inUnit = kind === 'row' ? r === i : c === i;
            if (!inUnit && elim(r, c)) progress = true;
          }
        }
      }
    }
    if (progress) { if (maxTier < 2) maxTier = 2; continue; }

    // T3a: k starless regions confined to k rows (or cols), k=2..3
    const starless = [];
    for (let g = 0; g < n; g++) {
      const u = unitAvail('reg', g);
      if (!u.hasStar && u.avail.length) starless.push({ g, avail: u.avail });
    }
    for (const dim of [0, 1]) {
      if (progress) break;
      const conf = starless
        .map(s => ({ g: s.g, set: new Set(s.avail.map(rc => rc[dim])) }))
        .filter(s => s.set.size <= 3);
      const tryCombo = (members) => {
        const union = new Set();
        members.forEach(m => m.set.forEach(v => union.add(v)));
        if (union.size !== members.length) return false;
        let any = false;
        const ids = new Set(members.map(m => m.g));
        for (const line of union) for (let j = 0; j < n; j++) {
          const r = dim === 0 ? line : j, c = dim === 0 ? j : line;
          if (!ids.has(reg[r][c]) && elim(r, c)) any = true;
        }
        return any;
      };
      for (let a = 0; a < conf.length && !progress; a++)
        for (let b = a + 1; b < conf.length && !progress; b++) {
          if (tryCombo([conf[a], conf[b]])) { progress = true; break; }
          for (let c2 = b + 1; c2 < conf.length && !progress; c2++)
            if (tryCombo([conf[a], conf[b], conf[c2]])) progress = true;
        }
    }
    if (progress) { maxTier = 3; t3++; continue; }

    // T3b: strangle — a star at X would leave some starless unit with no cells
    let strangled = false;
    for (let r = 0; r < n && !strangled; r++) for (let c = 0; c < n && !strangled; c++) {
      if (st[r][c] !== 0) continue;
      const dead = (rr, cc) =>
        rr === r || cc === c || reg[rr][cc] === reg[r][c] ||
        (Math.abs(rr - r) <= 1 && Math.abs(cc - c) <= 1);
      for (const [kind, i] of UNITS) {
        const u = unitAvail(kind, i);
        if (u.hasStar) continue;
        if (u.avail.some(([rr, cc]) => rr === r && cc === c)) continue; // unit satisfied by X
        if (u.avail.length && u.avail.every(([rr, cc]) => dead(rr, cc))) {
          elim(r, c); progress = true; strangled = true; break;
        }
      }
    }
    if (progress) { maxTier = 3; t3++; continue; }

    return { solved: false, maxTier, t3 };
  }
  return { solved: true, maxTier: maxTier || 1, t3 };
}

const BANDS = {
  easy:    g => g.maxTier <= 2 && g.t3 === 0,                 // forced cells + simple confinement (8×8)
  medium:  g => g.maxTier === 3 && g.t3 >= 1 && g.t3 <= 3,    // a few lookahead deductions (8×8)
  hard:    g => g.maxTier === 3 && g.t3 >= 2 && g.t3 <= 3,    // deduction chains (10×10)
  extreme: g => g.maxTier === 3 && g.t3 >= 4,                 // deep sustained chains (10×10)
};
const TARGET = { easy: [2, 0], medium: [3, 2], hard: [3, 3], extreme: [3, 5] };

function gradeFits(grade, difficulty) {
  return !!grade && grade.solved === true && BANDS[difficulty](grade);
}
function fitScore(grade, difficulty) {
  if (!grade || !grade.solved) return Infinity;
  const t = TARGET[difficulty];
  return Math.abs(grade.maxTier - t[0]) * 10 + Math.abs((grade.t3 || 0) - t[1]);
}
function generateCandidate(seedStr, index, difficulty) {
  const cfg = DIFF[difficulty];
  if (!cfg) return null;
  const rng = makeRng(seedStr + '#' + index);
  const stars = placeStars(cfg.n, rng);
  if (!stars) return null;
  let reg = growRegions(cfg.n, stars, rng, cfg);
  reg = shrinkPins(cfg.n, reg, stars, rng, cfg.pins);
  reg = makeUnique(cfg.n, reg, stars, rng, cfg.maxRounds);
  if (!reg) return null;
  const grade = logicSolve(cfg.n, reg);
  if (!grade.solved) return null;
  return { n: cfg.n, regions: reg, solution: stars, difficulty, grade, seed: seedStr, index };
}

function generatePuzzle(seedStr, difficulty, maxCandidates) {
  if (maxCandidates === undefined) maxCandidates = DIFF[difficulty] ? DIFF[difficulty].maxCandidates : 40;
  let best = null, bestScore = Infinity;
  for (let i = 0; i < maxCandidates; i++) {
    const cand = generateCandidate(seedStr, i, difficulty);
    if (!cand) continue;
    if (gradeFits(cand.grade, difficulty)) return cand;
    const s = fitScore(cand.grade, difficulty);
    if (s < bestScore) { bestScore = s; best = cand; }
  }
  return best;
}

function utcDateStr(d) { return (d || new Date()).toISOString().slice(0, 10); }
function dailySeed(dateStr, kind) { return 'coldshoulder-daily-' + dateStr + '-' + kind; }
// ==ENGINE-END==

    let selectedDiff = 'easy';
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDiff = btn.dataset.diff;
      });
    });

    // ── ID generator ─────────────────────────────────────────────────────────
    function generateId() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    // ── Main generation loop ─────────────────────────────────────────────────
    let generating = false;

    async function startGeneration() {
      if (generating) return;
      const count = Math.max(1, Math.min(100, parseInt(document.getElementById('count-input').value) || 10));
      const seedField = document.getElementById('seed-input').value.trim();
      const baseSeed = seedField || ('gen-' + Date.now() + '-' + Math.floor(Math.random() * 1e9));

      generating = true;
      document.getElementById('gen-btn').disabled = true;
      document.getElementById('spinner').classList.add('active');
      document.getElementById('output-section').classList.remove('visible');

      const puzzles = [];
      for (let i = 0; i < count; i++) {
        document.getElementById('progress-text').textContent =
          `Generating puzzle ${i + 1} of ${count}…`;
        await new Promise(r => setTimeout(r, 0)); // yield to UI

        const p = generatePuzzle(baseSeed + '-' + i, selectedDiff);
        if (!p) continue;
        puzzles.push({
          id: generateId(),
          difficulty: selectedDiff,
          n: p.n,
          regions: p.regions,
          solution: p.solution,
          seed: p.seed,
        });
      }

      generating = false;
      document.getElementById('gen-btn').disabled = false;
      document.getElementById('spinner').classList.remove('active');
      document.getElementById('progress-text').textContent =
        `Done — ${puzzles.length} puzzle${puzzles.length !== 1 ? 's' : ''} generated (seed base: ${baseSeed}).`;

      renderOutput(puzzles, selectedDiff);
    }

    function renderOutput(puzzles, diff) {
      const json = JSON.stringify({ puzzles }, null, 2);
      document.getElementById('output-ta').value = json;
      document.getElementById('output-label').textContent =
        `${puzzles.length} puzzle${puzzles.length > 1 ? 's' : ''} — ${diff}`;
      document.getElementById('output-section').classList.add('visible');

      const list = document.getElementById('puzzle-list');
      list.innerHTML = '';
      puzzles.forEach(p => {
        const row = document.createElement('div');
        row.className = 'puzzle-row';
        row.innerHTML = `
          <span class="pid">#${p.id}</span>
          <span class="meta">${p.n}×${p.n} grid</span>
          <span class="badge badge-${p.difficulty}">${p.difficulty}</span>
        `;
        list.appendChild(row);
      });
    }

    function copyOutput() {
      const ta = document.getElementById('output-ta');
      ta.select();
      document.execCommand('copy');
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy JSON'; btn.classList.remove('copied'); }, 2000);
    }
  </script>
